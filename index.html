<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <h1 id="typing"></h1>
        <p>Placeholder paragraph text.</p>
        <a href="https://github.com/yusufkashraf" class="btn">View GitHub</a>
    </div>
<script>
    const text = "Yusuf Kamal Ashraf"; 
    const heading = document.getElementById("typing");

    let index = 0;

    function type() {
        if (index < text.length) {
            heading.innerHTML += text.charAt(index);
            index++;
            setTimeout(type, 100);
        }
    }

    type();
</script>
</body>
</html>
